<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arc-sim — renderer demo</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(10, 14, 20, 0.82);
        --line: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: #0a0e14;
        color: #e8edf4;
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 16px;
        gap: 12px;
      }

      .scorebug {
        justify-self: center;
        display: flex;
        align-items: stretch;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        backdrop-filter: blur(8px);
        font-variant-numeric: tabular-nums;
      }
      .scorebug > div { padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
      .scorebug .team { font-weight: 600; letter-spacing: 0.02em; }
      .scorebug .pts { font-size: 20px; font-weight: 700; }
      .scorebug .sep { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
      .swatch { width: 10px; height: 18px; border-radius: 2px; }

      .situation { font-size: 13px; opacity: 0.85; }

      .caption {
        justify-self: center;
        align-self: end;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 16px;
        min-height: 42px;
        max-width: 70ch;
        text-align: center;
        transition: opacity 0.2s;
      }

      .side {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 300px;
        max-height: 60vh;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        pointer-events: auto;
        font-size: 12px;
      }
      .side h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; opacity: 0.6; letter-spacing: 0.08em; }
      .side li { list-style: none; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); opacity: 0.85; }
      .side ul { margin: 0; padding: 0; }
      .side .score { color: #ffd479; font-weight: 600; }

      .controls {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      button {
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] { background: #2a5cff; border-color: #2a5cff; }
      button:hover { border-color: rgba(255,255,255,0.35); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="hud">
      <div class="scorebug">
        <div><span class="swatch" id="home-swatch"></span><span class="team" id="home-name">HOME</span><span class="pts" id="home-score">0</span></div>
        <div class="sep situation"><span id="situation">—</span></div>
        <div><span class="pts" id="away-score">0</span><span class="team" id="away-name">AWAY</span><span class="swatch" id="away-swatch"></span></div>
      </div>
      <div></div>
      <div class="caption" id="caption">Loading…</div>
    </div>

    <aside class="side">
      <h2>Play by play</h2>
      <ul id="feed"></ul>
    </aside>

    <div class="controls">
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2" aria-pressed="false">2×</button>
      <button data-speed="6" aria-pressed="false">6×</button>
      <button data-speed="0" aria-pressed="false">Skip</button>
      <button id="restart">Restart</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
