# Publishes to npm with provenance — a signed attestation, generated by npm
# from GitHub's OIDC token, tying the exact tarball to the commit and workflow
# run that built it. That is the point of releasing from CI rather than from a
# laptop: a consumer can verify the code on npm is the code on GitHub, instead
# of taking it on trust.
#
# Cutting a GitHub release publishes. Nothing publishes on a push to main.
name: Release

on:
  release:
    types: [published]
  # Dry run without publishing, so this workflow can be exercised before it is
  # ever trusted with a real release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  # Required for provenance. Without it npm cannot get an OIDC token and the
  # publish fails rather than silently producing an unattested package.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The floor `engines` promises. Publishing on the oldest supported
          # runtime means the artifact was built by the compiler everyone has.
          node-version: 20
          cache: pnpm
          # Writes the .npmrc that NODE_AUTH_TOKEN below authenticates against.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs. Repeated here rather than assumed: a release is
      # permanent, and "CI was green on this commit" is a claim about a
      # different job that may have run against different dependencies.
      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the built package
        run: pnpm dist-check

      - name: Check the tag matches the version
        if: github.event_name == 'release'
        run: |
          version="v$(npm pkg get version | tr -d '"')"
          tag="${{ github.event.release.tag_name }}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json ($version)."
            echo "npm would publish $version under a release named $tag, and the"
            echo "two would disagree forever — a published version cannot be moved."
            exit 1
          fi
          echo "$tag matches package.json"

      - name: Refuse to republish an existing version
        if: github.event_name == 'release'
        run: |
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published. Bump the version."
            exit 1
          fi
          echo "$name@$version is unpublished; proceeding"

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        # `--access public` because a scoped package defaults to restricted, and
        # a restricted package needs a paid plan — the failure is confusing and
        # arrives only at publish time.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
