# The four steps below are `pnpm verify`, split apart so a red X names the
# stage that broke without anyone opening the log. Keep the two in sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, not just the first to fail — knowing it
      # breaks on the floor but passes on current is the useful signal.
      fail-fast: false
      matrix:
        # 20 is the floor `engines` promises; 24 is what people actually run.
        node: [20, 24]

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm on PATH to resolve the store cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The one that reads the published artifact rather than the source: that
      # emitted imports resolve, that the engine entry stays dependency-free,
      # and that a bare node can actually import the thing.
      - name: Check the built package
        run: pnpm dist-check
